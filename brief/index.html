<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekday market brief</title>
  <link rel="alternate" type="application/rss+xml" title="Weekday market brief" href="rss.xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #121418; }
    .point { font-size: 1.05rem; }
    .meta { color: var(--bs-secondary-color); font-size: .875rem; }
    .body pre { white-space: pre-wrap; font-family: inherit; color: inherit; }
    .watch-skip { --bs-badge-bg: #6c757d; }
    .watch-skim { --bs-badge-bg: #fd7e14; color: #111; }
    .watch-worth { --bs-badge-bg: #198754; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 820px;">
    <header class="mb-4">
      <p class="text-secondary mb-1 small"><a class="link-secondary" href="../">pages</a></p>
      <p class="text-secondary mb-1 small" id="owner"></p>
      <h1 class="h3 mb-1" id="title">Weekday market brief</h1>
      <p class="meta mb-0">
        Updated <span id="updated">-</span>
        · <a href="rss.xml" class="link-secondary">RSS</a>
      </p>
    </header>
    <div id="status" class="alert alert-secondary py-2">Loading feed.json</div>
    <div id="cards" class="d-flex flex-column gap-3"></div>
  </div>
  <script>
    function watchClass(w) {
      var k = String(w || "").toLowerCase();
      if (k.indexOf("worth") >= 0) return "watch-worth";
      if (k.indexOf("skim") >= 0) return "watch-skim";
      return "watch-skip";
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "\u0026amp;")
        .replace(/</g, "\u0026lt;")
        .replace(/>/g, "\u0026gt;")
        .replace(/"/g, "\u0026quot;")
        .replace(/'/g, "\u0026#39;");
    }
    fetch("feed.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("feed.json " + r.status);
        return r.json();
      })
      .then(function (data) {
        document.getElementById("title").textContent = (data.feed && data.feed.name) || "Weekday market brief";
        document.getElementById("owner").textContent = (data.feed && data.feed.owner) || "";
        document.getElementById("updated").textContent = data.updated || "-";
        var items = (data.briefs || []).slice().reverse();
        document.getElementById("status").textContent =
          items.length ? (items.length + " brief" + (items.length === 1 ? "" : "s")) : "No briefs in feed.json";
        document.getElementById("cards").innerHTML = items.map(function (v) {
          var bullets = (v.content || []).map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
          return "<article class=\"card\"><div class=\"card-body\">"
            + "<div class=\"d-flex justify-content-between align-items-start gap-2 mb-1\">"
            + "<div class=\"fw-semibold\">" + esc(v.published || "") + "</div>"
            + "<span class=\"badge " + watchClass(v.watch) + "\">" + esc(v.watch || "") + "</span>"
            + "</div>"
            + "<h2 class=\"h5\">" + esc(v.title) + "</h2>"
            + "<p class=\"point mb-2\"><strong>Point:</strong> " + esc(v.point) + "</p>"
            + (bullets ? "<p class=\"mb-1\"><strong>Content</strong></p><ul class=\"mb-2\">" + bullets + "</ul>" : "")
            + (v.watch_why ? "<p class=\"meta mb-2\">" + esc(v.watch_why) + "</p>" : "")
            + (v.body ? "<pre class=\"body mb-0 small\">" + esc(v.body) + "</pre>" : "")
            + "</div></article>";
        }).join("");
      })
      .catch(function (err) {
        document.getElementById("status").className = "alert alert-danger py-2";
        document.getElementById("status").textContent = "Could not load feed.json (" + err.message + ")";
      });
  </script>
</body>
</html>
