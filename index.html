<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok playlist</title>
  <link rel="alternate" type="application/rss+xml" title="Grok playlist" href="./rss.xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #121418; }
    .point { font-size: 1.05rem; }
    .meta { color: var(--bs-secondary-color); font-size: .875rem; }
    .watch-skip { --bs-badge-bg: #6c757d; }
    .watch-skim { --bs-badge-bg: #fd7e14; color: #111; }
    .watch-worth { --bs-badge-bg: #198754; }
  </style>
</head>
<body>
  <div class="container py-4" style="max-width: 820px;">
    <header class="mb-4">
      <p class="text-secondary mb-1 small" id="owner"></p>
      <h1 class="h3 mb-1" id="title">Playlist</h1>
      <p class="meta mb-0">
        Updated <span id="updated">—</span>
        · <a id="playlist-link" href="#" class="link-secondary">YouTube</a>
        · <a href="./rss.xml" class="link-secondary">RSS</a>
      </p>
    </header>
    <div id="status" class="alert alert-secondary py-2">Loading feed.json…</div>
    <div id="cards" class="d-flex flex-column gap-3"></div>
  </div>
  <script>
    const watchClass = (w) => {
      const k = (w || "").toLowerCase();
      if (k.includes("worth")) return "watch-worth";
      if (k.includes("skim")) return "watch-skim";
      return "watch-skip";
    };

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c]));

    const parseWhen = (raw) => {
      if (!raw) return NaN;
      const s = String(raw).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return Date.parse(s + "T12:00:00-04:00");
      return Date.parse(s);
    };

    const ageLabel = (raw) => {
      const t = parseWhen(raw);
      if (Number.isNaN(t)) return "—";
      const sec = Math.max(0, Math.floor((Date.now() - t) / 1000));
      if (sec < 60) return sec + "s";
      const min = Math.floor(sec / 60);
      if (min < 60) return min + "m";
      const hr = Math.floor(min / 60);
      if (hr < 48) return hr + "h";
      return Math.floor(hr / 24) + "d";
    };

    fetch("./feed.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("feed.json " + r.status);
        return r.json();
      })
      .then((data) => {
        document.getElementById("title").textContent = data.playlist?.name || "Playlist";
        document.getElementById("owner").textContent = data.playlist?.owner || "";
        document.getElementById("updated").textContent = data.updated || "—";
        const a = document.getElementById("playlist-link");
        a.href = data.playlist?.url || "#";
        const videos = (data.videos || []).slice().reverse();
        document.getElementById("status").textContent =
          videos.length ? videos.length + " video" + (videos.length === 1 ? "" : "s") : "No videos in feed.json";
        const root = document.getElementById("cards");
        root.innerHTML = videos.map((v) => {
          const bullets = (v.content || []).map((b) => `<li>${esc(b)}</li>`).join("");
          const href = v.url ? `<a class="link-light link-underline-opacity-25" href="${esc(v.url)}">${esc(v.title)}</a>` : esc(v.title);
          const age = ageLabel(v.published || v.processed_at);
          return `<article class="card"><div class="card-body">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                  <div class="fw-semibold">${esc(v.channel)}</div>
                  <span class="badge ${watchClass(v.watch)}">${esc(v.watch || "")}</span>
                </div>
                <h2 class="h5">${href}</h2>
                <p class="meta mb-2">${esc(v.duration || "")} · Published ${esc(v.published || "—")} · Age ${esc(age)}</p>
                <p class="point mb-2"><strong>Point:</strong> ${esc(v.point)}</p>
                ${bullets ? `<p class="mb-1"><strong>Content</strong></p><ul class="mb-2">${bullets}</ul>` : ""}
                ${v.watch_why ? `<p class="meta mb-0">${esc(v.watch_why)}</p>` : ""}
              </div></article>`;
        }).join("");
      })
      .catch((err) => {
        document.getElementById("status").className = "alert alert-danger py-2";
        document.getElementById("status").textContent = "Could not load feed.json (" + err.message + "). Serve over HTTP, not file://.";
      });
  </script>
</body>
</html>
